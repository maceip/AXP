name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run test:ops
      - run: npm run schema
      - run: git diff --exit-code -- schema
      - run: npm run demo
      - run: npm pack
      - run: npm run test:package
  container:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: docker build -f test/fixtures/Dockerfile -t axp-fixture .
      - run: npx tsx --test test/satellite.test.ts
        env:
          AXP_TEST_CONTAINER: axp-fixture
      - run: npm run build
      - run: docker build -f test/fixtures/linux.Dockerfile -t axp-linux .
      - run: docker run --detach --name axp-linux-proof --privileged --cgroupns=private --tmpfs /run --tmpfs /run/lock axp-linux
      - run: docker exec axp-linux-proof node scripts/linux-smoke.mjs
      - run: docker restart axp-linux-proof
      - run: docker exec axp-linux-proof node scripts/ops.mjs health http://127.0.0.1:7331/healthz 10
      - if: failure()
        run: docker exec axp-linux-proof journalctl --no-pager -n 150
      - if: always()
        run: docker rm -f axp-linux-proof
  browser:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:ui
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          path: test-results/
