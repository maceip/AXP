<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1796.7720000000002 381.75" width="1796.7720000000002" height="381.75" style="--bg:#f6f7f4;--fg:#252c28;--line:#8aa392;--accent:#397452;--muted:#626b65;--surface:#ffffff;--border:#cfd9cc">
<style>
  
  text { font-family: 'AXP Runde', system-ui, sans-serif; }
  .mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  .node > :first-child { filter: url(#axp-soft); }
  .edge, .node *, .subgraph * { stroke-linejoin: round; stroke-linecap: round; }
  svg {
    /* Derived from --bg and --fg (overridable via --line, --accent, etc.) */
    --_text:          var(--fg);
    --_text-sec:      var(--muted, color-mix(in srgb, var(--fg) 60%, var(--bg)));
    --_text-muted:    var(--muted, color-mix(in srgb, var(--fg) 40%, var(--bg)));
    --_text-faint:    color-mix(in srgb, var(--fg) 25%, var(--bg));
    --_line:          var(--line, color-mix(in srgb, var(--fg) 50%, var(--bg)));
    --_arrow:         var(--accent, color-mix(in srgb, var(--fg) 85%, var(--bg)));
    --_node-fill:     var(--surface, color-mix(in srgb, var(--fg) 3%, var(--bg)));
    --_node-stroke:   var(--border, color-mix(in srgb, var(--fg) 20%, var(--bg)));
    --_group-fill:    var(--bg);
    --_group-hdr:     color-mix(in srgb, var(--fg) 5%, var(--bg));
    --_inner-stroke:  color-mix(in srgb, var(--fg) 12%, var(--bg));
    --_key-badge:     color-mix(in srgb, var(--fg) 10%, var(--bg));
  }
</style>
<defs>
  <filter id="axp-soft" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="1.5" stdDeviation="1.4" flood-color="var(--fg)" flood-opacity="0.13" /></filter>
